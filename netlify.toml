# Netlify yapılandırması — BAI Teknoloji (Next.js 16 App Router)
# @netlify/plugin-nextjs (OpenNext adaptörü): SSR/ISR sayfaları ve API
# route'ları Netlify Functions (Node.js) olarak çalışır; on-demand
# revalidate (panel kaydı → /api/admin/revalidate) Netlify cache'ini temizler.
# Görseller Cloudinary'den (custom loader) — Netlify Image CDN kullanılmaz.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # firebase-admin 14 ve @google-cloud/firestore 9 Node >=22 ister. Node 20'de npm, firebase-admin'in
  # isteğe bağlı bağımlılığı olan @google-cloud/firestore'u sessizce atlıyor; build tip kontrolünde düşüyordu.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Güvenlik header'ları — tüm rotalar.
# CSP bilinçli olarak EKLENMEDİ (Firebase Auth/Firestore, Cloudinary
# upload ve Next inline script'leri test edilmeden kısıtlanırsa panel
# ve form kırılabilir). Eklenecekse Report-Only ile başlanmalı.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"

# Yönetim paneli ve API asla önbelleğe alınmaz / indekslenmez
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
